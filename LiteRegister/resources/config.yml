settings:
  # Префикс таблиц (lc_users, lc_meta) — единый для всех плагинов Империи
  table-prefix: "lc_"
  # Минимальная длина пароля
  min-password-length: 6
  # Максимум неверных попыток входа перед блокировкой
  max-login-attempts: 3
  # Длительность блокировки после превышения попыток, сек
  block-seconds: 60
  # Задержка перед показом формы после входа, тиков (20 = 1 сек)
  form-delay-ticks: 20
  # Автовход, если игрок заходит с IP, под которым регистрился/входил ранее
  auto-login-by-ip: true
  # Команды, разрешённые до авторизации (без слэша, в нижнем регистре)
  allowed-commands: []

