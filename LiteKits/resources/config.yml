# ═══════════════════════════════════════════════════════════════
#  КИТЫ — номер кита = требуемый вес ранга (LiteRanks)
# ───────────────────────────────────────────────────────────────
#  Поля кита:
#    name     — русское название
#    color    — §-цвет названия (совпадает с цветом ранга)
#    icon     — личный символ кита
#    weight   — требуемый вес ранга (кит 3 → ранг weight >= 3)
#    cooldown — кулдаун кита, сек (по умолчанию 18000 = 5 часов)
#    items    — список предметов:
#        id    — числовой ID предмета (ItemIds ядра)
#        count — количество (по умолчанию 1)
#        meta  — damage/вариация (по умолчанию 0)
#        name  — кастомное имя (необязательно)
#        ench  — зачарования: {ID: уровень}
#
#  ID зачарований (LiteCore + Bedrock 1.1.5):
#    0 Защита      5 Шипы        6 Подводное дыхание  7 Скорость под водой
#    9 Острота    10 Разящий клинок (Smite)   12 Отбрасывание
#   13 Заговор огня  14 Добыча  15 Эффективность  16 Шёлковое касание
#   17 Прочность  18 Удача     19 Сила (лук)   20 Отбрасывание (лук)
#   21 Пламя (лук)  22 Бесконечность
#   25 Ледоход (Frost Walker)   26 Починка (Mending)
# ═══════════════════════════════════════════════════════════════
